<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Настройка приватности в МАХ: пошаговая инструкция</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-password.css">
    <style>
        .step-list {
            counter-reset: step-counter;
            list-style: none;
            padding-left: 0;
            margin: 1.5rem 0;
        }
        .step-list li {
            counter-increment: step-counter;
            margin-bottom: 1.2rem;
            padding-left: 2.8rem;
            position: relative;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-soft);
        }
        .step-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            width: 1.8rem;
            height: 1.8rem;
            background: var(--accent-teal);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .setting-card {
            background: white;
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0;
            border: 1px solid rgba(44,122,110,0.15);
        }
        .setting-title {
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
        }
        .checklist-simple {
            background: rgba(255,255,245,0.8);
            border-radius: 1.2rem;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem 0 1rem 0;
        }
        .checklist-simple li {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(44,122,110,0.1);
        }
        .checklist-simple li:last-child {
            border-bottom: none;
        }
        .checklist-simple input {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--accent-teal);
            flex-shrink: 0;
            margin-top: 0.2rem;
        }
        .menu-toggle, .side-menu, .overlay {
            z-index: 1100;
        }
        .side-menu a::before {
            content: none;
        }
        .side-menu a {
            padding-left: 1rem;
        }
        @media (max-width: 680px) {
            .step-list li {
                font-size: 0.9rem;
                padding-left: 2.2rem;
            }
            .step-list li::before {
                width: 1.5rem;
                height: 1.5rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="menu-toggle" id="menuToggle">
    <span></span>
</div>
<div class="overlay" id="overlay"></div>
<div class="side-menu" id="sideMenu">
    <button class="close-menu" id="closeMenuBtn">✕</button>
    <div id="sideMenuContent">
        <div class="loader-sections">Загрузка разделов...</div>
